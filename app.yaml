runtime: nodejs22
env: standard
instance_class: F4_1G
entrypoint: node src/server.js

# Secrets live in secrets.yaml (git-ignored). Copy secrets.yaml.example, fill it in, then deploy.
# includes:
#   - secrets.yaml

# Keep one instance warm to avoid cold-start latency on the storefront.
automatic_scaling:
  min_instances: 1

env_variables:
  NODE_ENV: "production"
  PUBLIC_API_URL: "https://backend.fabricnow.pro"
  BG_MODEL_DIR: "/tmp/bg-models"
  PINTEREST_REDIRECT_URI: "https://backend.fabricnow.pro/api/companies/pinterest/oauth/callback"
  PINTEREST_FRONTEND_URL: "https://workspace.fabricnow.pro"
  ADMIN_EMAILS: "support@fabricnow.pro"
  SECRETS_ENCRYPTION_KEY: "nevermissmytarget@@!!"
